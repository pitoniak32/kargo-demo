name: wait-then-echo
on:
  workflow_dispatch:
    inputs:
      wait_time:
        description: Time to wait before echoing
        required: true
        type: number
      message:
        description: Message to echo after waiting
        required: true
        type: string
jobs:
  wait-and-echo:
    runs-on: ubuntu-latest
    steps:
      - name: Wait
        run: sleep ${{ inputs.wait_time }}
      - name: Echo
        run: echo "${{ inputs.message }}"
